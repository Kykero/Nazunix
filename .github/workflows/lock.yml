name: lock
on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # to dispatch check.yml
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake update
      - name: commit lock
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          if git commit -m "flake.lock: update"; then
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to commit"
          fi
        id: commit
      # pushes made with GITHUB_TOKEN never trigger `on: push`, so run check explicitly
      - name: dispatch check on the new lock
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run check.yml --ref main
